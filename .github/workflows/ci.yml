name: Local verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install -r requirements.txt -r requirements-aws.txt -r requirements-spark.txt
      - run: python -m pytest -q
        env:
          SPARK_LOCAL_IP: "127.0.0.1"
      - run: python -m pipeline.ingest --source data/sample/events.csv
      - run: python -m pipeline.spark_rollup
        env:
          SPARK_LOCAL_IP: "127.0.0.1"
      - uses: actions/upload-artifact@v6
        with:
          name: verified-local-output
          path: artifacts/
